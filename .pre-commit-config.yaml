# Install: `uv tool install pre-commit && pre-commit install`. Run: `pre-commit run --all-files`;
# jtex-autofix runs only with `--hook-stage manual`. CI runs check-ascii from here.
# What each hook guards: .github/CONTRIBUTING.md "Pre-commit Hooks".

repos:
  # Fixers skip the vendored files, which must match upstream byte for byte.
  # Per-hook via one anchor: a top-level exclude would stop jtex-check and
  # build-sample-pdf from firing when those files change.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: &vendored '\.(cls|cfg|bst)$'
      - id: end-of-file-fixer
        exclude: *vendored
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: check-merge-conflict
      # Reads the mode from the git index, so it fires even with core.filemode=false.
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: *vendored

  - repo: local
    hooks:
      - id: jtex-check
        name: Check template.yml with jtex
        entry: bash -c 'npm list -g jtex &> /dev/null || npm install -g jtex; jtex check'
        language: system
        pass_filenames: false
        files: '^(template\.(tex|yml)|econsocart\.(cls|cfg)|(qe|te|econsoc)\.bst|thumbnail\.png)$'

      - id: jtex-autofix
        name: Auto-fix template.yml with jtex
        entry: bash -c 'npm list -g jtex &> /dev/null || npm install -g jtex; jtex check --fix'
        language: system
        pass_filenames: false
        files: '^(template\.(tex|yml))$'
        stages: [manual]

      # The file list lives here only: CI runs this hook rather than its own copy.
      - id: check-ascii
        name: Check for non-ASCII characters
        entry: '[^\x00-\x7F]'
        language: pygrep
        files: '^(README\.md|sample/(article|appendix|supplement)\.md|template\.(tex|yml)|myst\.yml)$'

      - id: build-sample-pdf
        name: Build sample PDFs
        entry: bash -c 'npm list -g mystmd &> /dev/null || npm install -g mystmd; scripts/build-samples.sh'
        language: system
        pass_filenames: false
        files: '^(sample/.*\.(md|bib|png|jpg|eps|pdf)|template\.(tex|yml)|econsocart\.(cls|cfg)|(qe|te|econsoc)\.bst)$'
