# CI: jtex template check, ASCII-only sources, template options in the emitted LaTeX, sample
# PDFs (clean logs, unchanged text), the MyST plugins, and the vendored files' drift guard.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly: CI installs the latest mystmd and plugins/ relies on its internals,
  # so an upstream release that breaks them (or fixes their bug) shows up here.
  schedule:
    - cron: '17 6 * * 1'
  # Manual trigger. Both automatic triggers are push-driven, so when GitHub's
  # webhook delivery is degraded no run is created at all and there is no way to
  # start one by hand. This costs two lines and removes that dependency.
  workflow_dispatch:

# Every job here only reads the checkout and greps it. Declaring least privilege
# explicitly means the jobs do not inherit a repo or org default of read-write.
permissions:
  contents: read

# Supersede in-flight runs for the same ref. Correctness is unaffected either
# way; this just stops a rapid series of pushes from queueing duplicate matrices.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-template:
    name: Validate Template Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install jtex
        run: npm install -g jtex

      - name: Check template.yml
        run: jtex check

      # Declaring a package in template.yml SUPPRESSES MyST's injection of it, so a
      # declaration nothing loads leaves its macros undefined (the booktabs defect;
      # MyST never injects amssymb at all).
      - name: Assert every declared package is actually loaded
        shell: bash
        run: |
          set -eo pipefail
          loads() {
            grep -qE "(usepackage|RequirePackage)(\[[^]]*\])?\{[^}]*\b$1\b[^}]*\}" "$2"
          }
          declared=$(sed -n '/^packages:/,$p' template.yml | grep '^  - ' | sed 's/^  - //')
          test -n "$declared" || { echo "FAIL: no packages parsed from template.yml"; exit 1; }
          echo "checking $(printf '%s\n' "$declared" | wc -l) declared packages"
          missing=""
          for p in $declared; do
            loads "$p" template.tex || loads "$p" econsocart.cls || loads "$p" econsocart.cfg \
              || missing="$missing $p"
          done
          [ -z "$missing" ] || {
            echo "FAIL: declared in template.yml but loaded by nothing:$missing"
            echo "A declaration stops MyST injecting it, so these macros would be undefined."
            exit 1; }
          echo "every declaration is backed by a real load"

  check-escaping:
    name: Assert LaTeX Specials Are Escaped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install MyST
        run: npm install -g mystmd

      # The assertions live in a script so they can be seeded and re-run. They
      # were verified by hand in scratch directories during the session that
      # found the bugs, which is a memory rather than coverage.
      - name: Assert specials escaped and absent fields emit no empty macros
        run: scripts/check-escaping.sh

      # An assertion that cannot fail protects nothing. Four seeded defects, one
      # per assertion class, each of which must be caught.
      - name: Assert the escaping checks can still fail
        run: scripts/check-escaping.sh --self-test

  build-pdf:
    name: Compile Samples to PDF and Gate the Log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # texlive-xetex is required (myst drives xelatex and xdvipdfmx). The rest follow the .sty
      # files a compile loads: latex-extra for adjustbox/cleveref/epigraph/supertabular/
      # threeparttable/wrapfig, science for algorithmicx/mhchem, fonts-* for times/helvet.
      - name: Install MyST and a TeX toolchain
        run: |
          npm install -g mystmd
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-latex-extra texlive-latex-recommended \
            texlive-science texlive-fonts-recommended texlive-fonts-extra \
            poppler-utils

      # A missing package makes xelatex's nonstopmode recovery DELETE the glyph
      # and still exit 0, so prove every package the template declares resolves
      # before trusting any later assertion.
      - name: Assert every declared package is installed
        run: |
          set -eo pipefail
          declared=$(sed -n '/^packages:/,$p' template.yml | grep '^  - ' | sed 's/^  - //')
          test -n "$declared" || { echo "FAIL: no packages parsed from template.yml"; exit 1; }
          # Loaded without a declaration: natbib by econsocart.cfg, caption by subcaption.
          class_loaded="natbib caption"
          missing=""
          for p in $declared $class_loaded; do
            kpsewhich "$p.sty" >/dev/null || missing="$missing $p"
          done
          [ -z "$missing" ] || { echo "FAIL: missing .sty:$missing"; exit 1; }
          command -v xelatex >/dev/null || { echo "FAIL: xelatex not installed"; exit 1; }
          command -v xdvipdfmx >/dev/null || { echo "FAIL: xdvipdfmx not installed"; exit 1; }
          echo "all declared packages resolve"

      # kpsewhich proves the package is INSTALLED, not that the template loads
      # it. MyST injects booktabs only for tables it emits, so a raw-LaTeX table
      # compiled with \toprule undefined and shipped with no rules at exit 0.
      - name: Assert a raw booktabs table compiles clean
        run: |
          set -eo pipefail
          mkdir -p _bt && cd _bt
          cat > myst.yml <<'YML'
          version: 1
          project:
            authors: [{name: Ada Test, email: a@e.edu, affiliations: [u]}]
            affiliations: [{id: u, institution: Test University}]
            exports:
              - id: t
                format: tex+pdf
                template: ../
                output: out/t.pdf
                articles: [{file: main.md}]
          YML
          cat > main.md <<'MD'
          ---
          title: Booktabs Probe
          short_title: Probe
          ---

          ```{raw} latex
          \begin{table}
          \centering
          \begin{tabular}{lrr}
          \toprule
          Model & Mean & SD \\
          \midrule
          A & 1.00 & 0.10 \\
          \bottomrule
          \end{tabular}
          \end{table}
          ```
          MD
          myst build --pdf --force > bt.log 2>&1 || true
          # Positive control first. A zero grep is evidence only once the file
          # being counted over is known to exist: an empty $log makes grep fail
          # on a missing path, which reads as "no errors found".
          grep -q 'This is XeTeX' bt.log \
            || { echo "FAIL: xelatex never ran; the checks below would be vacuous"; exit 1; }
          # Every non-empty log, not `head -1`: the pick is filesystem-ordered
          # and t.shell.log is 0 lines, so one run greps the real log and the
          # next greps an empty file and calls it clean.
          mapfile -t logs < <(find . -name '*.log' -path '*_logs*' -size +0c)
          test "${#logs[@]}" -gt 0 \
            || { echo "FAIL: no non-empty LaTeX log; the check would be vacuous"; exit 1; }
          for log in "${logs[@]}"; do
            echo "gating $log ($(wc -l < "$log") lines)"
            if grep -qE 'Undefined control sequence' "$log"; then
              grep -nE 'Undefined control sequence' "$log" | head -3
              echo "FAIL: the template does not load booktabs for raw tables"; exit 1
            fi
          done
          pdftotext out/t.pdf - | grep -q 'Mean' \
            || { echo "FAIL: raw table did not render"; exit 1; }
          echo "raw booktabs table compiles and renders"

      # scripts/build-samples.sh is the gate: it clears and counts the exports, greps each log, and
      # checks the emitted \bibliographystyle per journal. docs/template-internals.md says why.
      - name: Build and verify every sample export
        run: |
          set -eo pipefail
          scripts/build-samples.sh 2>&1 | tee build.log

      # The two things build-samples.sh cannot see. A jtex render error aborts
      # the export BEFORE any LaTeX log exists, and mystmd still exits 0, so the
      # only trace is this stdout.
      - name: Gate the myst stdout for render aborts
        run: |
          set -eo pipefail
          grep -q 'This is BibTeX' build.log \
            || { echo "FAIL: bibtex never ran; the gate would pass vacuously"; exit 1; }
          . scripts/lib-econsoc.sh
          if render_aborted build.log; then
            echo "FAIL: a template render aborted (see the build log above)"; exit 1
          fi
          # A \begin/\end pair in the FENCED raw form is parsed by tex-to-myst, which logs
          # this and puts the environment name on the website; use :::{raw:latex}.
          # macro_legend is expected.
          if grep -nE 'Unhandled TEX conversion for node of "macro_(begin|end)"' build.log; then
            echo "FAIL: a \\begin/\\end pair is in a fenced raw block; use :::{raw:latex}"
            exit 1
          fi
          echo "no render aborts, no unconvertible structural macros, bibtex ran"

      # The strongest gate here. Page counts and a title string do not notice
      # three proof blocks silently vanishing, which is what happened; only a
      # text diff against the committed artifact does.
      - name: Diff rebuilt PDF text against the committed artifacts
        run: |
          set -eo pipefail
          rc=0
          for f in sample/exports/*.pdf; do
            git show "HEAD:$f" > /tmp/committed.pdf
            pdftotext /tmp/committed.pdf /tmp/committed.txt
            pdftotext "$f" /tmp/rebuilt.txt
            if ! diff -q /tmp/committed.txt /tmp/rebuilt.txt >/dev/null; then
              echo "=== $f text differs from the committed PDF ==="
              diff /tmp/committed.txt /tmp/rebuilt.txt | head -30
              rc=1
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo
            echo "The committed PDFs no longer match what this source builds."
            echo "If the change is intended, rebuild and commit them:"
            echo "  rm -rf _build sample/exports/*_pdf_tex sample/exports/*_pdf_logs"
            echo "  myst build --pdf --force"
            exit 1
          fi
          echo "all six PDFs match the committed text"

      # Every plugins/README.md case exits 0 without its repair, so this reads the emitted LaTeX,
      # the site and the compiled fixture, requires each repair's assertions to fail with it off,
      # and fails on a mystmd release the bundle was not built for (weekly: the latest).
      - name: Check the plugins, their compiled fixture, and the committed bundle
        run: |
          (cd plugins && npm ci)
          scripts/check-plugins.sh --pdf

  check-ascii:
    name: Check for Non-ASCII Characters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same hook pre-commit runs, so the file list exists once.
      - name: Check user-editable files for unicode
        run: pipx run pre-commit run check-ascii --all-files

  test-options:
    # Renders one document per case to LaTeX (no TeX toolchain) and asserts each option's own
    # token in the output: a render that merely succeeds passes with the option's conditional
    # deleted from template.tex. `final` is the default branch, which build-pdf exercises.
    name: Render Template Options to LaTeX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install MyST
        run: npm install -g mystmd

      - name: Render each option and assert it reaches the LaTeX
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "FAIL ($label): $*" >&2; exit 1; }
          has_opt() { printf '%s' "$class" | grep -q "[,[]$1[],]"; }
          # render LABEL KEY:VALUE...: one export option per pair; $fm replaces open_access: false,
          # which myst.yml would otherwise make true everywhere. The citation is REQUIRED: without
          # one doc.bibliography stays empty and template.tex sets no bibliography.
          render() {
            label=$1; shift
            opts=$(printf '    %s\n' "$@")
          cat > "test_$label.md" <<EOF
          ---
          title: Test Document ($label)
          short_title: Test
          ${fm:-open_access: false}
          exports:
            - format: tex
              template: ./
              output: test_${label}_tex
          $opts
          authors:
            - name: {given: Test, surname: Author}
              email: test@example.com
              affiliations: [aff1]
          affiliations:
            - {id: aff1, department: Test Department, institution: Test University}
          keywords: [test]
          tags: [C00]
          bibliography: sample/references.bib
          parts:
            abstract: Test abstract
            acknowledgement: Test acknowledgement
          ---

          # Test Section

          Test document for $label {cite:t}\`b2\`.
          EOF
            myst build "test_$label.md" --tex < /dev/null
            tex=$(find "test_${label}_tex" -name '*.tex' | head -1)
            test -n "$tex" || fail "no .tex emitted"
            class=$(grep -m1 '^\\documentclass' "$tex")
            echo "$label: $class"
          }

          # econsocart processes options in declaration order, so `final` emitted beside
          # `linenumbers` silently makes it inert.
          for opt in draft seceqn linenumbers supplement; do
            render "$opt" "$opt: true"
            has_opt "$opt" || fail "option '$opt' missing from the emitted \\documentclass"
            has_opt openaccess && fail "openaccess emitted although open_access is false"
            if [ "$opt" = linenumbers ] && has_opt final; then
              fail "'final' emitted alongside 'linenumbers'; the option is inert"
            fi
          done

          # extra_packages is emitted verbatim as one comma-separated \usepackage.
          fm='open_access: true' render extra 'extra_packages: tikz,pgfplots'
          grep -q '^\\usepackage{tikz,pgfplots}$' "$tex" || fail "extra_packages did not reach \\usepackage"
          has_opt openaccess || fail "open_access did not reach \\documentclass"

          # journal sets class option and .bst; preprint keeps both, so only its \form@runauthors
          # block (blank running head, no "Submitted to") tells it apart. Supplement metadata
          # differs per journal, hence a supplement leg each.
          for leg in "qe qe qe false false" "ecta ecta econsoc false false" "te te te false false" \
                     "te-preprint te te true false" "qe-preprint qe qe true false" \
                     "ecta-preprint ecta econsoc true false" "qe-supplement qe qe false true" \
                     "ecta-supplement ecta econsoc false true" "te-supplement te te false true"; do
            read -r label journal bst preprint supplement <<<"$leg"
            render "$label" "journal: $journal" "preprint: $preprint" "supplement: $supplement"
            grep -q "documentclass\[$journal," "$tex" || fail "expected econsocart class option '$journal'"
            grep -q "\\\\bibliographystyle{$bst}" "$tex" || fail "expected \\bibliographystyle{$bst}"
            suppressed=false
            if grep -q '\\def\\form@runauthors' "$tex"; then suppressed=true; fi
            [ "$suppressed" = "$preprint" ] \
              || fail "preprint=$preprint but journal-identification suppression present=$suppressed"
          done
          echo "every option, extra feature and journal leg reaches the LaTeX"

  check-upstream-drift:
    # The root class/bst files are copies of the original/* submodules, since MyST fetches no
    # submodules; this job fails when one diverges. scripts/sync-vendored.sh picks each source: the
    # class from the newest submodule release, each .bst from its own journal.
    name: Check Vendored Files Match Pinned Upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Assert root class/bst copies equal the pinned submodules
        run: scripts/sync-vendored.sh --check

      - name: Assert the drift guard can still fail
        # The step above exercises only the passing branch. This mutates a disposable
        # copy of the inputs seven ways and requires each to be rejected by name.
        run: scripts/selftest-sync-vendored.sh
