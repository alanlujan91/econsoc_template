# Continuous Integration Workflow
#
# This workflow runs on every push and pull request to validate the template.
# It ensures:
# - Template structure is valid (jtex check)
# - All referenced files exist
# - Sample document compiles successfully
# - No unicode characters in source files
# - Documentation is properly formatted
# - Template options work correctly
#
# For more details on automation, see README.md "Development & Quality Assurance"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger. Both automatic triggers are push-driven, so when GitHub's
  # webhook delivery is degraded no run is created at all and there is no way to
  # start one by hand. This costs two lines and removes that dependency.
  workflow_dispatch:

# Every job here only reads the checkout and greps it. Declaring least privilege
# explicitly means the jobs do not inherit a repo or org default of read-write.
permissions:
  contents: read

# Supersede in-flight runs for the same ref. Correctness is unaffected either
# way; this just stops a rapid series of pushes from queueing duplicate matrices.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-template:
    name: Validate Template Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install jtex
        run: npm install -g jtex

      - name: Check template.yml
        run: jtex check

      - name: Verify all template files exist
        run: |
          python3 << 'EOF'
          import yaml, sys, os
          with open('template.yml') as f:
              template = yaml.safe_load(f)
          missing = []
          for file in template.get('files', []):
              if not os.path.exists(file):
                  missing.append(file)
          if missing:
              print(f"ERROR: Missing template files: {', '.join(missing)}")
              sys.exit(1)
          print("All template files exist!")
          EOF

      - name: Check thumbnail exists
        run: |
          if [ ! -f thumbnail.png ]; then
            echo "ERROR: Missing thumbnail.png"
            echo "Generate a thumbnail from the sample PDF first page"
            exit 1
          fi

  render-samples:
    # CI validates that the template RENDERS valid LaTeX, which needs no TeX
    # toolchain. PDF *compilation* (which needs a full TeX install plus the
    # packages in template.yml `packages:`) is validated locally by the
    # pre-commit `build-sample-pdf` hook, where the author already has TeX.
    # To render without compiling, the samples' `tex+pdf` export is swapped to
    # `format: tex` and built with `--tex`.
    name: Render Samples to LaTeX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install image conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ghostscript poppler-utils

      - name: Install MyST
        run: npm install -g mystmd

      - name: Render sample and supplement to LaTeX (no TeX toolchain)
        run: |
          cd sample
          # Each source carries one export per journal, so this renders six
          # documents: every journal for both the article and the supplement.
          # The output rewrite has to strip the exports/ directory as well as
          # the .pdf suffix, or the dry run would write into the tracked
          # output location.
          for f in article supplement; do
            sed "s/format: tex+pdf/format: tex/; s#output: exports/\(.*\)\.pdf#output: \1_texcheck#" "$f.md" > "_ci_$f.md"
            myst build "_ci_$f.md" --tex
            rm -f "_ci_$f.md"
          done

      # Rendering without error proves nothing about CONTENT: myst-to-tex drops
      # proof kinds it cannot map and still exits 0 (see issue #1). Assert the
      # kinds the sample declares actually reach the .tex.
      - name: Assert declared content reaches the LaTeX
        shell: bash
        run: |
          set -eo pipefail
          tex=$(find sample -name '*.tex' -path '*_texcheck*' | head -1)
          test -n "$tex" || { echo "no rendered .tex found"; exit 1; }
          for env in theorem proposition lemma corollary definition remark; do
            grep -q "\\\\begin{$env}" "$tex" \
              || { echo "FAIL: \\begin{$env} missing from $tex"; exit 1; }
          done
          echo "all declared proof kinds present"

      # A `---` attribution line in a blockquote makes MyST wrap it in a figure
      # with \caption*. econsocart ignores the star and typesets "FIGURE 0." into
      # the paper. Exit 0, no log error. Use `--`, which stays inside the quote.
      - name: Assert no starred caption reaches the LaTeX
        shell: bash
        run: |
          set -eo pipefail
          for tex in $(find sample -name '*.tex' -path '*_texcheck*'); do
            if grep -n '\\caption\*' "$tex"; then
              echo "FAIL: \\caption* in $tex renders as FIGURE 0"
              echo "A blockquote attribution written '--- Name' causes this; use '-- Name'."
              exit 1
            fi
          done
          echo "no starred captions"

  check-escaping:
    name: Assert LaTeX Specials Are Escaped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install MyST
        run: npm install -g mystmd

      # The assertions live in a script so they can be seeded and re-run. They
      # were verified by hand in scratch directories during the session that
      # found the bugs, which is a memory rather than coverage.
      - name: Assert specials escaped and absent fields emit no empty macros
        run: scripts/check-escaping.sh

      # An assertion that cannot fail protects nothing. Four seeded defects, one
      # per assertion class, each of which must be caught.
      - name: Assert the escaping checks can still fail
        run: scripts/check-escaping.sh --self-test

  build-pdf:
    name: Compile Samples to PDF and Gate the Log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # texlive-xetex is not optional: myst drives xelatex and xdvipdfmx, and
      # neither ships in texlive-latex-extra. The set below was derived from the
      # .sty files a real local compile loads, not guessed.
      #   adjustbox/cleveref/epigraph/supertabular/threeparttable/wrapfig ->
      #     latex-extra; algorithmicx/mhchem -> science; times/helvet -> fonts-*
      - name: Install MyST and a TeX toolchain
        run: |
          npm install -g mystmd
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-latex-extra texlive-latex-recommended \
            texlive-science texlive-fonts-recommended texlive-fonts-extra \
            poppler-utils

      # A missing package makes xelatex's nonstopmode recovery DELETE the glyph
      # and still exit 0, so prove every package the template declares resolves
      # before trusting any later assertion.
      - name: Assert every declared package is installed
        run: |
          set -eo pipefail
          missing=""
          for p in adjustbox algpseudocode amssymb bm cancel changepage cleveref \
                   epigraph etoolbox hyperref mhchem multirow subcaption \
                   supertabular tabularx threeparttable wrapfig natbib caption; do
            kpsewhich "$p.sty" >/dev/null || missing="$missing $p"
          done
          [ -z "$missing" ] || { echo "FAIL: missing .sty:$missing"; exit 1; }
          command -v xelatex >/dev/null || { echo "FAIL: xelatex not installed"; exit 1; }
          command -v xdvipdfmx >/dev/null || { echo "FAIL: xdvipdfmx not installed"; exit 1; }
          echo "all declared packages resolve"

      # scripts/build-samples.sh is the gate. It already clears exports so no
      # stale artifact can satisfy an assertion, asserts the export count, greps
      # each log with a regex that covers latexmk's -file-line-error rewriting
      # and `Class econsocart Error:`, and checks the emitted \bibliographystyle
      # per journal. It ran only in pre-commit until now, so CI never saw it.
      - name: Build and verify every sample export
        run: |
          set -eo pipefail
          scripts/build-samples.sh 2>&1 | tee build.log

      # The two things build-samples.sh cannot see. A jtex render error aborts
      # the export BEFORE any LaTeX log exists, and mystmd still exits 0, so the
      # only trace is this stdout.
      - name: Gate the myst stdout for render aborts
        run: |
          set -eo pipefail
          grep -q 'This is BibTeX' build.log \
            || { echo "FAIL: bibtex never ran; the gate would pass vacuously"; exit 1; }
          if grep -nE 'Template render error|TypeError' build.log; then
            echo "FAIL: a template render aborted above"; exit 1
          fi
          echo "no render aborts, bibtex ran"

      # The strongest gate here. Page counts and a title string do not notice
      # three proof blocks silently vanishing, which is what happened; only a
      # text diff against the committed artifact does.
      - name: Diff rebuilt PDF text against the committed artifacts
        run: |
          set -eo pipefail
          rc=0
          for f in sample/exports/*.pdf; do
            git show "HEAD:$f" > /tmp/committed.pdf
            pdftotext /tmp/committed.pdf /tmp/committed.txt
            pdftotext "$f" /tmp/rebuilt.txt
            if ! diff -q /tmp/committed.txt /tmp/rebuilt.txt >/dev/null; then
              echo "=== $f text differs from the committed PDF ==="
              diff /tmp/committed.txt /tmp/rebuilt.txt | head -30
              rc=1
            fi
          done
          if [ "$rc" -ne 0 ]; then
            echo
            echo "The committed PDFs no longer match what this source builds."
            echo "If the change is intended, rebuild and commit them:"
            echo "  rm -rf _build sample/exports/*_pdf_tex sample/exports/*_pdf_logs"
            echo "  myst build --pdf --force"
            exit 1
          fi
          echo "all six PDFs match the committed text"

  check-ascii:
    name: Check for Non-ASCII Characters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check user-editable files for unicode
        run: |
          FILES="README.md sample/article.md sample/appendix.md sample/supplement.md template.tex template.yml myst.yml"

          for file in $FILES; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              if ! python3 -c "import sys; content = open('$file', 'rb').read(); non_ascii = [i for i, b in enumerate(content) if b > 127]; sys.exit(1 if non_ascii else 0)"; then
                echo "ERROR: Non-ASCII characters found in $file"
                exit 1
              fi
            fi
          done

          echo "All files are ASCII-clean!"

  test-template-options:
    # Renders the template to LaTeX (no TeX toolchain) for each declared boolean
    # option, to catch conditional-logic regressions. `final` is NOT tested: it
    # is not a declared option (it is the default when draft is false, emitted by
    # the [# else #] branch), and the render-samples job exercises that default.
    # Recommended by MyST docs: "Your template should work in an incomplete state"
    # Source: https://mystmd.org/jtex/create-a-latex-template
    name: Render Template with Different Options
    runs-on: ubuntu-latest
    strategy:
      matrix:
        option: [draft, seceqn, linenumbers, supplement]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install MyST
        run: npm install -g mystmd

      - name: Create test document with ${{ matrix.option }} option
        run: |
          cat > test_${{ matrix.option }}.md << 'EOF'
          ---
          title: Test Document (${{ matrix.option }})
          short_title: Test
          exports:
            - format: tex
              template: ./
              output: test_${{ matrix.option }}_tex
              ${{ matrix.option }}: true
          authors:
            - name:
                given: Test
                surname: Author
              email: test@example.com
              affiliations: ["aff1"]
          affiliations:
            - id: aff1
              department: Test Department
              institution: Test University
          keywords:
            - test
          tags:
            - C00
          bibliography: sample/references.bib
          parts:
            abstract: Test abstract
            acknowledgement: Test acknowledgement
          ---

          # Test Section

          This is a test document to verify template option: ${{ matrix.option }}.
          EOF

      - name: Render with ${{ matrix.option }} option (no TeX toolchain)
        run: myst build test_${{ matrix.option }}.md --tex

      - name: Assert ${{ matrix.option }} actually reached the class options
        # Rendering alone asserts nothing. Deleting an option's conditional from
        # template.tex entirely leaves this job green if it only checks that the
        # build did not crash, so each option is checked for its own token on the
        # emitted \documentclass line. `linenumbers` additionally asserts that
        # `final` is ABSENT: econsocart processes options in declaration order, so
        # emitting `final` alongside `linenumbers` silently makes the option inert.
        run: |
          set -euo pipefail
          tex=$(find test_${{ matrix.option }}_tex -name '*.tex' | head -1)
          if [ -z "$tex" ]; then
            echo "no .tex emitted for ${{ matrix.option }}" >&2; exit 1
          fi
          line=$(grep -m1 '^\\documentclass' "$tex")
          echo "documentclass: $line"
          case "${{ matrix.option }}" in
            draft)       expect=draft ;;
            seceqn)      expect=seceqn ;;
            linenumbers) expect=linenumbers ;;
            supplement)  expect=supplement ;;
          esac
          if ! printf '%s' "$line" | grep -q "[,[]$expect[],]"; then
            echo "ERROR: option '$expect' missing from the emitted \\documentclass" >&2
            exit 1
          fi
          if [ "${{ matrix.option }}" = linenumbers ] && printf '%s' "$line" | grep -q '[,[]final[],]'; then
            echo "ERROR: 'final' emitted alongside 'linenumbers'; the option is inert" >&2
            exit 1
          fi

  test-extra-features:
    # extra_packages and open_access are declared in template.yml and had no
    # test at all. Neither fits the boolean options matrix: one is a string
    # export option, the other a frontmatter field.
    name: Render extra_packages and open_access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install MyST
        run: npm install -g mystmd

      - name: Render a document using both
        run: |
          set -eo pipefail
          cat > test_extra.md << 'EOF'
          ---
          title: Extra Features
          short_title: Extra
          open_access: true
          authors:
            - name: Ada Test
              email: a@example.org
              affiliations: [u]
          affiliations:
            - id: u
              institution: Test University
          exports:
            - format: tex
              template: ./
              output: test_extra_tex
              extra_packages: tikz,pgfplots
          ---

          Body.
          EOF
          myst build test_extra.md --tex

      - name: Assert both reached the emitted LaTeX
        run: |
          set -eo pipefail
          tex=$(find test_extra_tex -name '*.tex' | head -1)
          test -n "$tex" || { echo "FAIL: no .tex emitted"; exit 1; }
          # The option is emitted verbatim as one comma-separated \usepackage,
          # which is valid LaTeX; asserting one line per name would fail here.
          grep -q '^\\usepackage{tikz,pgfplots}$' "$tex" \
            || { echo "FAIL: extra_packages did not reach \\usepackage"; exit 1; }
          # open_access must reach the class options; the licence text it gates
          # is added by the journal at production and is not asserted here.
          grep -m1 '^\\documentclass' "$tex" | grep -q 'openaccess' \
            || { echo "FAIL: open_access did not reach \\documentclass"; exit 1; }
          echo "extra_packages and open_access both reach the LaTeX"

  test-journal-options:
    # The `journal` choice option selects both the econsocart class option (the
    # layout, running head, and "Submitted to ..." banner) and the BibTeX style.
    # Rendering alone would not catch a wrong style, so each run asserts the
    # emitted \bibliographystyle as well: Econometrica ships econsoc.bst,
    # Quantitative Economics qe.bst, Theoretical Economics te.bst, and the
    # neutral preprint mode borrows qe to match the qe layout it renders with.
    #
    # The `{cite:t}` in the test body is REQUIRED, not decoration. MyST only
    # populates doc.bibliography when the document actually cites something, so
    # without a citation template.tex takes its no-bibliography branch, emits no
    # \bibliographystyle line at all, and every assertion below fails. Declaring
    # `bibliography:` in the frontmatter is not sufficient on its own.
    #
    # The supplement legs exist because econsocart gives each journal different
    # supplement metadata (Econometrica has its own supplement journal name and
    # URL, and its own copyright owner), so supplement plumbing that works for
    # qe can still break for ecta.
    name: Render Template for Each Journal
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - label: qe
            journal: qe
            bst: qe
          - label: ecta
            journal: ecta
            bst: econsoc
          - label: te
            journal: te
            bst: te
          # preprint is orthogonal to journal, so it gets tested ON a journal
          # rather than instead of one. te was chosen deliberately: when preprint
          # was itself a journal value it forced the qe layout, so a Theoretical
          # Economics preprint was silently typeset as Quantitative Economics
          # with qe.bst. This leg asserts the te class option and te.bst survive
          # preprint mode, which is the regression that design allowed.
          - label: te-preprint
            journal: te
            bst: te
            preprint: true
          - label: qe-preprint
            journal: qe
            bst: qe
            preprint: true
          - label: ecta-preprint
            journal: ecta
            bst: econsoc
            preprint: true
          - label: qe-supplement
            journal: qe
            bst: qe
            supplement: true
          - label: ecta-supplement
            journal: ecta
            bst: econsoc
            supplement: true
          - label: te-supplement
            journal: te
            bst: te
            supplement: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install MyST
        run: npm install -g mystmd

      - name: Create test document for ${{ matrix.label }}
        run: |
          cat > test_${{ matrix.label }}.md << 'EOF'
          ---
          title: Test Document (${{ matrix.label }})
          short_title: Test
          exports:
            - format: tex
              template: ./
              output: test_${{ matrix.label }}_tex
              journal: ${{ matrix.journal }}
              supplement: ${{ matrix.supplement || false }}
              preprint: ${{ matrix.preprint || false }}
          authors:
            - name:
                given: Test
                surname: Author
              email: test@example.com
              affiliations: ["aff1"]
          affiliations:
            - id: aff1
              department: Test Department
              institution: Test University
          keywords:
            - test
          tags:
            - C00
          bibliography: sample/references.bib
          parts:
            abstract: Test abstract
            acknowledgement: Test acknowledgement
          ---

          # Test Section

          This is a test document targeting: ${{ matrix.journal }} {cite:t}`b2`.
          EOF

      - name: Render for ${{ matrix.label }} (no TeX toolchain)
        run: myst build test_${{ matrix.label }}.md --tex

      - name: Assert class option and bibliography style
        run: |
          set -eo pipefail
          tex=$(find test_${{ matrix.label }}_tex -name '*.tex' | head -1)
          # An empty $tex would make every grep below read stdin and hang, or
          # pass vacuously; the assertions are only meaningful on a real file.
          test -n "$tex" || { echo "FAIL: no .tex produced"; exit 1; }
          echo "Checking $tex"

          # preprint renders with the qe layout; every other value passes through.
          # preprint no longer substitutes a layout, so the class option is
          # always the journal that was asked for.
          expected_class='${{ matrix.journal }}'

          if ! grep -q "documentclass\[$expected_class," "$tex"; then
            echo "ERROR: expected econsocart class option '$expected_class'"
            grep -n 'documentclass' "$tex" || true
            exit 1
          fi

          if ! grep -q '\\bibliographystyle{${{ matrix.bst }}}' "$tex"; then
            printf 'ERROR: expected \\bibliographystyle{%s}\n' '${{ matrix.bst }}'
            grep -n 'bibliographystyle' "$tex" || true
            exit 1
          fi

          # The class option and style assertions above are now IDENTICAL for a
          # journal and its preprint, which is the point of making preprint
          # orthogonal. So the suppression block itself has to be asserted, or
          # nothing distinguishes the two and the only thing preprint does would
          # be untested. It blanks the journal running head and suppresses the
          # "Submitted to ..." line; breaking it would still render, still pass
          # every other assertion, and start leaking the target journal into PDFs
          # meant to be journal-neutral.
          if [ '${{ matrix.preprint || false }}' = 'true' ]; then
            if ! grep -q '\\def\\form@runauthors' "$tex"; then
              echo "ERROR: preprint must suppress journal identification, but the"
              printf '       \\form@runauthors override is absent from the output\n'
              exit 1
            fi
            echo "OK: preprint suppression block present"
          elif grep -q '\\def\\form@runauthors' "$tex"; then
            echo "ERROR: ${{ matrix.label }} must NOT suppress journal identification,"
            printf '       but the preprint-only \\form@runauthors override is present\n'
            exit 1
          fi

          # Naming a style is not the same as shipping one. template.tex, this
          # matrix, template.yml and the pre-commit file list all hardcode the
          # journal-to-style mapping, and the vendoring script derives it from
          # upstream instead. If upstream renames a style, the script vendors the
          # new file while template.tex keeps emitting the old name, the old file
          # is orphaned at the root where nothing checks it any more, and every
          # other gate stays green. These two assertions tie the emitted name to
          # what is actually vendored and actually shipped, without a toolchain.
          if [ ! -f '${{ matrix.bst }}.bst' ]; then
            echo "ERROR: ${{ matrix.bst }}.bst is named by the template but not vendored at the repo root"
            ls -1 ./*.bst || true
            exit 1
          fi

          if ! grep -qE "^ *- *${{ matrix.bst }}\.bst *$" template.yml; then
            echo "ERROR: ${{ matrix.bst }}.bst is not in template.yml files:, so jtex will never copy it"
            echo "       into the build directory and BibTeX will not find it"
            exit 1
          fi

          echo "OK: class option '$expected_class', style '${{ matrix.bst }}' vendored and shipped"

  check-upstream-drift:
    # The class/bst files at the repo root are vendored copies of the pinned
    # original/* submodules (kept in sync by sync-upstream-template.yml). They
    # are copied, not symlinked, so the template stays self-contained when MyST
    # fetches it (submodules are not fetched) and works on Windows. This job is
    # the drift guard: it fails if a root copy diverges from the pinned commit.
    #
    # The source of each file is decided by scripts/sync-vendored.sh, not
    # hardcoded here: econsocart.cls/.cfg are shared across all three journals
    # and come from whichever submodule ships the newest release, while each
    # .bst comes from its own journal.
    name: Check Vendored Files Match Pinned Upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Assert root class/bst copies equal the pinned submodules
        run: scripts/sync-vendored.sh --check

      - name: Assert the drift guard can still fail
        # The step above only ever exercises the passing branch, so on its own it
        # cannot distinguish a working guard from one that has been disabled.
        # This mutates a disposable copy of the inputs nine ways and requires
        # each to be rejected with a diagnostic naming the reason.
        run: scripts/selftest-sync-vendored.sh
