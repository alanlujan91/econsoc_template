# Weekly or by hand: when an upstream template (.gitmodules) moves, re-vendor the root files with
# scripts/sync-vendored.sh and open one labelled PR. Upstream sends no events, so polling is the
# only trigger; ci.yml's check-upstream-drift guards every push.

name: Sync Upstream Template Files

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual triggering

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for upstream updates
        id: check-updates
        run: |
          set -euo pipefail
          moved=""

          for journal in ecta qe te; do
            # Deliberately not named `path`: that is a special PATH-bound array
            # in zsh, so the name is a trap for anyone running this logic
            # outside GitHub's bash.
            dir="original/$journal"

            # Do not assume a branch name: qe tracks main, ecta and te track
            # master, and any of them could change.
            git -C "$dir" fetch --quiet origin
            git -C "$dir" remote set-head origin -a >/dev/null
            branch=$(git -C "$dir" symbolic-ref --short refs/remotes/origin/HEAD | sed 's|^origin/||')

            local_sha=$(git -C "$dir" rev-parse HEAD)
            remote_sha=$(git -C "$dir" rev-parse "origin/$branch")

            if [ "$local_sha" != "$remote_sha" ]; then
              echo "$journal: $local_sha -> $remote_sha (branch $branch)"
              git -C "$dir" checkout --quiet "$remote_sha"
              moved="$moved $journal"
            else
              echo "$journal: up to date"
            fi
          done

          moved=${moved# }
          if [ -n "$moved" ]; then
            echo "updates=true" >> "$GITHUB_OUTPUT"
            echo "moved=$moved" >> "$GITHUB_OUTPUT"
          else
            echo "updates=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-vendor root files
        if: steps.check-updates.outputs.updates == 'true'
        run: |
          set -euo pipefail

          # Picks the newest econsocart.cls/.cfg across all three submodules and
          # each .bst from its own journal. See scripts/sync-vendored.sh.
          sync_log=$(scripts/sync-vendored.sh)
          printf '%s\n' "$sync_log"

          # A PR opened with GITHUB_TOKEN triggers no workflow, so check-upstream-drift
          # never runs on it: this step checks its own output before a human merges.
          scripts/sync-vendored.sh --check

          CLASS_VERSION=$(sed -n '/ProvidesClass{econsocart}/{
              s/.*ProvidesClass{econsocart}\[\([^]]*\)\].*/\1/p
              q
          }' econsocart.cls)
          echo "CLASS_VERSION=$CLASS_VERSION" >> "$GITHUB_ENV"

          # Which journal the shared class came from is the most consequential
          # thing about the change and is otherwise invisible in the PR body.
          CLASS_SOURCE=$(printf '%s\n' "$sync_log" | awk '
              /^synced econsocart\.cls/ {
                  for (i = 1; i <= NF; i++) {
                      if ($i ~ /^original\//) { sub("original/", "", $i); print $i; exit }
                  }
              }')
          echo "CLASS_SOURCE=$CLASS_SOURCE" >> "$GITHUB_ENV"

      - name: Create Pull Request
        if: steps.check-updates.outputs.updates == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync upstream Econometric Society templates"
          title: "Sync upstream templates (${{ steps.check-updates.outputs.moved }})"
          body: |
            ## Automated Update from Upstream

            This PR advances the pinned Econometric Society template submodules
            and re-vendors the root files.

            ### Submodules updated
            `${{ steps.check-updates.outputs.moved }}`

            ### Vendored files
            Re-generated by `scripts/sync-vendored.sh`:

            - `econsocart.cls` / `econsocart.cfg` - shared by all three journals,
              taken from whichever submodule ships the newest release. This run
              took them from **`${{ env.CLASS_SOURCE }}`** (`${{ env.CLASS_VERSION }}`)
            - `qe.bst`, `te.bst`, `econsoc.bst` - journal-specific, each from its
              own upstream

            Only files whose content actually changed appear in the diff; a
            submodule can move without any vendored file changing.

            ### Sources
            - https://github.com/vtex-soft/texsupport.econometricsociety-ecta
            - https://github.com/vtex-soft/texsupport.econometricsociety-qe
            - https://github.com/vtex-soft/texsupport.econometricsociety-te

            ### Verification

            The sync job re-ran `scripts/sync-vendored.sh --check` against its own
            output, and that passed.

            Note that **CI does not run on this pull request**: it was opened with
            `GITHUB_TOKEN`, and GitHub does not trigger workflow runs from events
            raised by that token. An empty checks list here means "no checks ran",
            not "all checks passed". Please review the diff on its merits.
          branch: update-upstream-template
          delete-branch: true
          labels: |
            dependencies
            automated
