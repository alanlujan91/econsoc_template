jtex: v1
title: Econometric Society Journals Template
description: >-
  Unofficial MyST Markdown template for Econometric Society journal submissions:
  Econometrica, Quantitative Economics, and Theoretical Economics. Not endorsed
  by The Econometric Society or VTeX; bundles the official econsocart class
  files, which are copyright UAB "VTeX" and licensed LPPL 1.3c
version: 1.0.0
license: CC-BY-4.0
source: https://github.com/alanlujan91/econsoc_template
thumbnail: ./thumbnail.png
authors:
  - name: Alan Lujan
    website: https://github.com/alanlujan91
tags:
  - paper
  - journal
  - economics
  - econometric-society
  - econometrica
  - quantitative-economics
  - theoretical-economics
doc:
  - id: title
    required: true
    description: Title of the paper
  - id: short_title
    required: true
    description: Running head title
  - id: bibliography
    required: false
    description: Bibliography file (BibTeX .bib file)
  - id: keywords
    required: false
    description: Keywords for the paper (3-8 recommended)
  - id: tags
    required: false
    description: >-
      JEL codes/tags for the paper (up to 3 codes in alphabetical order).
      Suppressed automatically under journal:ecta, because Econometrica's own
      sample and template carry no JEL block; keep them in frontmatter and they
      still emit for the qe and te exports of the same source.
  - id: authors
    required: true
    description: List of author objects with name, surname, email, and affiliations
  - id: affiliations
    required: true
    description: List of affiliation objects with id, department, and institution
  - id: open_access
    required: false
    description: Enable the econsocart openaccess class option (set open_access true in frontmatter)
parts:
  - id: abstract
    required: false
    description: Abstract of the paper (max 150 words recommended)
  - id: acknowledgement
    required: false
    description: Acknowledgements and funding information
  - id: appendix
    required: false
    description: Appendix, set after the body under the class's appendix lettering (needs plugins/econsoc.mjs)
  - id: econsoc_localdefs
    required: false
    description: >-
      Written by plugins/econsoc.mjs, never by the author: the definitions of the theorem
      environments the paper uses, in place of the template's definitions of every kind
  - id: econsoc_packages
    required: false
    description: >-
      Written by plugins/econsoc.mjs, never by the author: the \usepackage lines of the
      template's optional packages the paper uses, in place of loading every one
  - id: econsoc_cleveref
    required: false
    description: >-
      Written by plugins/econsoc.mjs, never by the author: present when the paper uses
      cleveref, which the template then loads at the end of the preamble
  - id: econsoc_letters_off
    required: false
    description: >-
      Written by plugins/econsoc.mjs, never by the author: present when the paper holds no
      character xelatex's T1 font would drop or misprint, so the template leaves out its letter maps
options:
  - type: choice
    id: journal
    description: >-
      Which journal the manuscript is typeset for: qe = Quantitative Economics,
      ecta = Econometrica, te = Theoretical Economics. This sets the econsocart
      class option, the layout, the running head, and the bibliography style
      (qe.bst, econsoc.bst, te.bst respectively). To produce a neutral working
      paper, keep this set to your actual target and use the preprint option,
      which strips the journal identification without changing the layout.
    default: qe
    choices:
      - qe
      - ecta
      - te
  - type: boolean
    id: preprint
    description: >-
      Strip journal identification while keeping the journal's own layout and
      bibliography style: no "Submitted to ..." banner, no journal running head,
      no copyright line. On by default, so a PDF does not accidentally announce
      where it was submitted; set it false when you actually submit. Orthogonal
      to journal on purpose, so a Theoretical Economics preprint is typeset as
      Theoretical Economics rather than retyped in another journal's layout.
    default: true
  - type: boolean
    id: draft
    description: >-
      Proof layout for the submission stage: US Letter, line numbers, increased
      line spacing, and the "Submitted to ..." banner. This is what the three
      journals ask for in a submitted PDF (at least 12pt, at least 1.5 spacing);
      omit it for the camera-ready version, which uses the typeset journal
      layout. All three treat the LaTeX class as optional at submission.
    default: false
  - type: boolean
    id: supplement
    description: Supplementary material document
    default: false
  - type: boolean
    id: seceqn
    description: Number equations by section (e.g., Equation 2.1)
    default: false
  - type: boolean
    id: linenumbers
    description: >-
      Display line numbers (useful during review). A draft numbers its lines
      unless this is set to false explicitly; left unset, the draft keeps them.
    default: false
  - type: boolean
    id: axiom_as_assumption
    description: >-
      Print {prf:axiom} blocks as "Assumption N" on the assumption counter. Use it
      when assumptions are written as axioms because myst-to-tex drops
      {prf:assumption} (docs/myst-authoring.md, "Theorem-like Environments").
    default: false
  - type: boolean
    id: observation_as_algorithm
    description: >-
      Print {prf:observation} blocks as "Algorithm N" on the algorithm counter, the
      same workaround for {prf:algorithm}.
    default: false
  - type: string
    id: extra_packages
    description: >-
      Comma-separated LaTeX packages to load, e.g. "mhchem,cancel". For packages
      MyST recognizes but its LaTeX renderer does not auto-inject, so you can use
      them in raw LaTeX blocks without forking the template. Three names will
      break the build and must NOT be listed: soul (clashes with econsocart's
      \caps), csquotes (its \enquote clashes with qe.bst), and algorithm (its
      \algorithm clashes with the numbered algorithm theorem environment this
      template defines; the collision destroys the journal layout while still
      exiting 0). algorithm2e collides the same way.
files:
  - template.tex
  - econsocart.cls
  - econsocart.cfg
  - qe.bst
  - te.bst
  - econsoc.bst
myst: v1
packages:
  - adjustbox
  - algpseudocode
  - amssymb
  - array
  - booktabs
  - bm
  - cancel
  - changepage
  - cleveref
  - epigraph
  - etoolbox
  - fontenc
  - framed
  - hyperref
  - mhchem
  - multirow
  - subcaption
  - supertabular
  - tabularx
  - textcomp
  - threeparttable
  - times
  - ulem
  - url
  - wrapfig
